<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de chantier — comptes rendus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2328; --ink-2:#4B5259; --ink-3:#7A8187;
  --paper:#FFFFFF; --canvas:#EEF0ED; --panel:#F7F8F6; --rule:#D5D8D3; --rule-2:#E4E6E2;
  --brand:#C4161C; --brand-soft:#FBE9E9;
  --plan:#25587F; --plan-soft:#E3EDF5;
  --ok:#2E7D32; --ok-soft:#E3F1E4;
  --warn:#D9730D; --warn-soft:#FCEEDD;
  --urgent:#B00020; --urgent-soft:#FADDE1;
  --font:"Archivo", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EAE7; --ink-2:#B9BEC2; --ink-3:#8B9197;
    --paper:#1C1F22; --canvas:#141618; --panel:#202427; --rule:#363B40; --rule-2:#2B3034;
    --brand:#E5484D; --brand-soft:#3A1E20;
    --plan:#7FB2DB; --plan-soft:#1F2F3D;
    --ok:#5FBF66; --ok-soft:#1D3220;
    --warn:#F0A048; --warn-soft:#3A2A17;
    --urgent:#FF6B7F; --urgent-soft:#3D1A21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EAE7; --ink-2:#B9BEC2; --ink-3:#8B9197;
  --paper:#1C1F22; --canvas:#141618; --panel:#202427; --rule:#363B40; --rule-2:#2B3034;
  --brand:#E5484D; --brand-soft:#3A1E20;
  --plan:#7FB2DB; --plan-soft:#1F2F3D;
  --ok:#5FBF66; --ok-soft:#1D3220;
  --warn:#F0A048; --warn-soft:#3A2A17;
  --urgent:#FF6B7F; --urgent-soft:#3D1A21;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--plan);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
.rail{background:var(--paper);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.rail-head img{width:38px;height:38px;object-fit:contain}
.rail-head .t{font-weight:700;font-stretch:90%;line-height:1.15}
.rail-head .s{font-size:12px;color:var(--ink-3)}
.rail-tools{padding:12px 16px;display:grid;gap:8px;border-bottom:1px solid var(--rule-2)}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;padding:6px 8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{overflow:auto;flex:1;padding:6px 0}
.d-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
.d-item:hover{background:var(--panel)}
.d-item[aria-current="true"]{background:var(--panel);border-left-color:var(--brand)}
.d-item .c{font-weight:700;font-stretch:88%;letter-spacing:.01em}
.d-item .o{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-item .m{font-size:12px;color:var(--ink-3)}
.rail-cur{padding:14px 16px;border-bottom:1px solid var(--rule-2)}
.rail-cur:empty{display:none}
.rail-cur .c{font-weight:700;font-stretch:88%}
.rail-cur .o{font-size:13px;color:var(--ink-2)}
.rail-cur .m{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot #appVer{font-size:11px;color:var(--ink-3)}
.rail-foot{padding:10px 16px;border-top:1px solid var(--rule-2);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3)}

.main{min-width:0;overflow:auto;display:flex;flex-direction:column}
.empty{margin:auto;max-width:440px;text-align:center;padding:40px 24px;color:var(--ink-2)}
.empty h2{color:var(--ink);font-stretch:90%;margin:0 0 8px}

.d-head{background:var(--paper);border-bottom:1px solid var(--rule);padding:18px 28px 0;position:sticky;top:0;z-index:5}
.d-head .row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.d-code{font-size:28px;font-weight:800;font-stretch:80%;letter-spacing:.005em;line-height:1.05;margin:0}
.d-sub{color:var(--ink-2);margin-top:4px}
.d-sub b{color:var(--ink);font-weight:600}
.badge-arch{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--rule-2);color:var(--ink-2);margin-left:8px;vertical-align:middle}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.body{padding:24px 28px 80px;max-width:1080px;width:100%}

/* ---------- controls ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--urgent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=number],select,textarea{
  width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 10px;font-size:14px}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--plan);outline:none;box-shadow:0 0 0 3px var(--plan-soft)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chk{width:18px;height:18px;accent-color:var(--ink);cursor:pointer}

/* ---------- sections ---------- */
.sec{background:var(--paper);border:1px solid var(--rule);border-radius:8px;margin-bottom:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--rule-2)}
.sec-h h3{margin:0;font-size:16px;font-weight:700;font-stretch:90%}
.sec-h .hint{font-size:13px;color:var(--ink-3)}
.sec-b{padding:16px 18px}
.muted{color:var(--ink-3)}
.small{font-size:13px}

.pv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.pv-title{font-size:22px;font-weight:800;font-stretch:85%}
.pv-title small{font-weight:500;color:var(--ink-3);font-size:14px;margin-left:8px;font-stretch:100%}
.state{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600}
.btn.ok-b{border-color:var(--ok);color:var(--ok)}
.state.draft{background:var(--warn-soft);color:var(--warn)}
.state.sent{background:var(--ok-soft);color:var(--ok)}

/* presence table */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:600;font-size:12px;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
table.t td{padding:8px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
table.t td.c,table.t th.c{text-align:center;width:90px}
.scroll-x{overflow-x:auto}

/* lot tile — signature element */
.lot{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:3px;color:#fff;font-weight:800;font-size:13px;font-stretch:85%;flex:none}
.pnum{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:3px;font-weight:700;font-size:11.5px;line-height:1;font-stretch:85%;color:#fff;flex:none;letter-spacing:.01em}
.ilogo{width:34px;height:34px;object-fit:contain;border:1px solid var(--rule-2);border-radius:4px;background:#fff;flex:none}

/* lots and points */
.lot-block{border-top:1px solid var(--rule-2)}
.lot-block:first-child{border-top:0}
.lot-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--panel)}
.lot-head .n{font-weight:700}
.lot-head .r{color:var(--ink-3);font-size:13px}
.lot-head .sp{flex:1}
.lot-points{padding:4px 18px 14px}
.lot-none{color:var(--ink-3);font-size:13px;padding:8px 0}

.pt{border:1px solid var(--rule);border-left-width:4px;border-radius:6px;margin-top:10px;background:var(--paper)}
.pt.s-rappel{border-left-color:var(--warn)}
.pt.s-urgent{border-left-color:var(--urgent)}
.pt.s-urgent>.pt-h{background:var(--urgent-soft);border-radius:0 6px 0 0}
.pt.s-realise{border-left-color:var(--ok)}
.pt.s-new{border-left-color:var(--plan)}
.pt.s-open{border-left-color:var(--rule)}
.pt-h{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap}
.pt-h .ttl{font-weight:600;flex:1;min-width:160px}
.pt.collapsed .pt-h .ttl{font-weight:500;color:var(--ink-2)}
.pt-b{padding:0 12px 12px 12px;display:grid;gap:10px}
.pt-txt{white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff}
.tag.warn{background:var(--warn);color:#fff}
.tag.urg{background:var(--urgent);color:#fff}
.tag.new{background:var(--plan-soft);color:var(--plan)}
.tag.open{background:var(--rule-2);color:var(--ink-2)}
.tag.due{background:transparent;border:1px solid var(--rule);color:var(--ink-2);font-weight:600}
.tag.due.late{border-color:var(--urgent);color:var(--urgent)}
.decide{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-top:1px dashed var(--rule);background:var(--panel);border-radius:0 0 6px 6px}
.decide .lbl{font-size:13px;color:var(--ink-2);margin-right:4px}
.decide .btn.ok{border-color:var(--ok);color:var(--ok)}
.decide .btn.ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.decide .btn.warn{border-color:var(--warn);color:var(--warn)}
.decide .btn.warn[aria-pressed="true"]{background:var(--warn);color:#fff}
.decide .btn.urg{border-color:var(--urgent);color:var(--urgent)}
.decide .btn.urg[aria-pressed="true"]{background:var(--urgent);color:#fff}
.hist{font-size:12px;color:var(--ink-3)}
.note-pv{border-left:2px solid var(--rule);padding-left:10px}

.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:160px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff;cursor:pointer;padding:0}
.ph .fig{position:relative;line-height:0}
.ph img{display:block;width:100%;height:auto}
.ph svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ph .cap{display:block;font-size:12px;padding:4px 6px;line-height:1.3;color:var(--ink-2);text-align:left;background:var(--paper)}
.ph-add{width:160px;min-height:100px;border:1.5px dashed var(--rule);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);cursor:pointer;font-size:13px;background:transparent}
.ph-add:hover{border-color:var(--ink-3);color:var(--ink-2)}

/* form card */
.pform{border:1px solid var(--plan);border-radius:6px;padding:12px;margin-top:10px;display:grid;gap:10px;background:var(--plan-soft)}
.pform .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* planning */
.gantt{overflow-x:auto;border:1px solid var(--rule-2);border-radius:6px}
.gantt table{border-collapse:collapse;font-size:12px;min-width:100%}
.gantt th,.gantt td{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);padding:0;height:28px}
.gantt th{font-weight:600;color:var(--ink-3);padding:4px 6px;white-space:nowrap;text-align:center;background:var(--panel)}
.gantt td.lbl{padding:4px 8px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--paper);z-index:1}
.gantt th.lbl{position:sticky;left:0;z-index:2;text-align:left}
.gantt td.w{min-width:34px;position:relative}
.gantt td.w.now{background:var(--brand-soft)}
.gantt .bar{position:absolute;top:6px;bottom:6px;border-radius:2px}

/* overlay / modal */
.ov-bg{position:fixed;inset:0;background:rgba(15,18,20,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:max(20px,env(safe-area-inset-top,0px)) 16px 20px;overflow:auto}
.modal{background:var(--paper);border-radius:10px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0}
.modal.wide{width:min(1100px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule)}
.modal-h h3{margin:0;font-size:17px;font-stretch:90%}
.modal-b{padding:16px 18px;display:grid;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.res{border:1px solid var(--rule);border-radius:6px;max-height:340px;overflow:auto}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule-2);background:transparent;padding:9px 12px;cursor:pointer}
.res button:hover,.res button[aria-pressed="true"]{background:var(--plan-soft)}
.res .c{font-weight:700;font-stretch:88%}
.res .o{font-size:13px;color:var(--ink-2)}
.msg{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--panel);color:var(--ink-2)}
.msg.err{background:var(--urgent-soft);color:var(--urgent)}

/* annotation */
.anno-stage{display:flex;justify-content:center;background:#222;border-radius:4px;padding:6px}
.anno-wrap{position:relative;display:inline-block;line-height:0;max-width:100%;touch-action:none;user-select:none}
.anno-wrap img{display:block;max-width:100%;max-height:68vh;width:auto;height:auto;pointer-events:none}
.anno-wrap svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* ---------- document (CR) ---------- */
.doc-stage{background:#5b6166;padding:24px 12px;min-height:100%}
.doc{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#111;width:min(794px,100%);margin:0 auto 24px;padding:44px 52px;font-family:var(--font);font-size:12.5px;line-height:1.45;box-shadow:0 4px 24px rgba(0,0,0,.35)}
.doc .hd{display:flex;gap:18px;align-items:flex-start}
.doc .hd img{max-width:190px;max-height:100px;width:auto;height:auto;object-fit:contain}
.doc .hd .ag{font-size:11px;color:#333}
.doc .hd .ag b{font-size:12px;color:#111}
.doc h1{font-size:24px;font-weight:600;margin:22px 0 2px;font-stretch:95%}
.doc .meta{font-size:12px;color:#333}
.doc .band{background:#f1f1f1;padding:4px 8px;margin:16px 0 8px;font-size:12px}
.doc .proj{font-weight:700;font-size:13.5px}
.doc table.it{width:100%;border-collapse:collapse;font-size:11.5px}
.doc table.it th{font-weight:500;font-size:10.5px;color:#444;text-align:center;padding:4px}
.doc table.it td{padding:6px 4px;border-bottom:1px solid #e5e5e5;vertical-align:top}
.doc table.it td.c{text-align:center;width:66px;font-size:16px}
.doc .box{display:inline-block;width:14px;height:14px;border:1.4px solid #222;position:relative;vertical-align:middle}
.doc .box.on::after{content:"";position:absolute;left:3px;top:0px;width:5px;height:9px;border:solid #222;border-width:0 2px 2px 0;transform:rotate(45deg)}
.doc h2{font-size:17px;font-weight:600;margin:20px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #222;font-stretch:95%}
.doc .hl{background:#fff36b;padding:0 2px}
.doc .pb{break-before:page;page-break-before:always}
.doc .lt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin:16px 0 6px;text-transform:uppercase}
.doc .lt img{width:26px;height:26px;object-fit:contain}
.doc .dp{margin:6px 0 10px 0;padding-left:10px;border-left:3px solid #ccc;break-inside:avoid}
.doc .dp.s-rappel{border-left-color:#D9730D}
.doc .dp.s-urgent{border-left-color:#B00020}
.doc .dp.s-realise{border-left-color:#2E7D32}
.doc .dp .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc .dp .h b{font-size:12.5px}
.doc .pnum{height:15px;font-size:10px;padding:0 4px}
.doc .past-h{font-size:10.5px;color:#2E7D32;font-weight:700;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.doc .dp.past{margin:2px 0;opacity:.85}
.doc .dp .tx{white-space:pre-wrap;margin-top:3px}
.doc .tg{font-size:10px;font-weight:700;color:#fff;padding:1px 7px;border-radius:9px}
.doc .tg.ok{background:#2E7D32}.doc .tg.warn{background:#D9730D}.doc .tg.urg{background:#B00020}.doc .tg.new{background:#25587F}
.doc .tg.due{background:transparent;color:#333;border:1px solid #999}
.doc .tg.due.late{color:#B00020;border-color:#B00020}
.doc .phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.doc .phs figure{margin:0;width:calc(50% - 4px);break-inside:avoid}
.doc .phs .fig{position:relative;line-height:0}
.doc .phs img{width:100%;height:auto;display:block}
.doc .phs svg{position:absolute;inset:0;width:100%;height:100%}
.doc .phs figcaption{font-size:10.5px;color:#444;margin-top:2px}
.doc .gt{width:100%;border-collapse:collapse;font-size:10px}
.doc .gt th,.doc .gt td{border:1px solid #ddd;height:18px;padding:0}
.doc .gt th{font-weight:500;color:#555;padding:2px}
.doc .gt td.l{padding:2px 5px;white-space:nowrap;font-size:10.5px}
.doc .gt td.w{position:relative}
.doc .gt .bar{position:absolute;top:4px;bottom:4px;border-radius:1px}
.doc .ft{font-size:10px;color:#666;text-align:right;margin-top:24px}

.ref{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:8px;padding:6px 10px;border:1px dashed var(--rule);border-radius:6px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink-2)}
.ref:hover{border-color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);background:var(--panel);border-radius:99px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.tag.memo{background:var(--plan-soft);color:var(--plan);border:1px dashed var(--plan)}
.pt.s-memo{border-left-color:var(--plan);border-left-style:dashed}
.past-h{font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px;padding-top:8px;border-top:1px dashed var(--rule)}
.pt.past{margin-top:4px}
.pt.past .pt-h{padding:5px 12px}
.pt.flash{box-shadow:0 0 0 3px var(--plan)}
.todo{display:grid;gap:4px}
.todo-i{display:flex;align-items:center;gap:8px;font-size:14px}
.todo-i.done span{text-decoration:line-through;color:var(--ink-3)}
.todo-i .x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;padding:0 4px}
.todo-add{border-style:dashed!important;font-size:13px!important}
fieldset.also{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 16px;margin:0}
fieldset.also legend{font-size:13px;color:var(--ink-2);padding:0 4px}
fieldset.also label{display:flex;align-items:center;gap:6px;font-size:13px}
.plan-stage{display:flex;justify-content:center;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px}
.plan-wrap{position:relative;display:inline-block;line-height:0;max-width:100%;background:#fff}
.plan-wrap img{display:block;max-width:100%;max-height:75vh;width:auto;height:auto}
.plan-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.plan-pick svg{cursor:crosshair}
.prev-grid{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 60px)}
.prev-opts{padding:16px;display:grid;gap:14px;align-content:start;border-right:1px solid var(--rule);background:var(--paper)}
.prev-opts fieldset.also{flex-direction:column}
.mailbox{display:grid;gap:8px;padding:10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.doc .tg.memo{background:#E3EDF5;color:#25587F}
.doc .td{margin-top:4px;font-size:11.5px;display:grid;gap:2px}
.doc .td .box{width:11px;height:11px}
.doc .td .box.on::after{left:2px;top:-1px;width:4px;height:7px}
.doc .phs.r3 figure{width:calc(33.33% - 6px)}
.doc .phs.r4 figure{width:calc(25% - 6px)}
.doc figure.pl{margin:6px 0 12px;break-inside:avoid}
.doc figure.pl .fig{position:relative;line-height:0;border:1px solid #ccc}
.doc figure.pl img{width:100%;display:block}
.doc figure.pl svg{position:absolute;inset:0;width:100%;height:100%}
.doc figure.pl figcaption{font-size:10.5px;color:#444;margin-top:3px}
@media print{.prev-grid{display:block}.prev-opts{display:none!important}}
@media (max-width: 860px){.prev-grid{grid-template-columns:1fr}.prev-opts{border-right:0;border-bottom:1px solid var(--rule)}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .app,.ov-bg>.modal>.modal-h,.no-print,.toast{display:none!important}
  .ov-bg{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;width:auto;border-radius:0;background:#fff}
  .doc-stage{background:none;padding:0}
  .doc{box-shadow:none;width:auto;padding:0;margin:0}
}

@media (max-width: 860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--rule);max-height:44vh}
  .d-head{padding:14px 16px 0;position:static}
  .body{padding:16px 14px 60px}
  .grid2,.grid3{grid-template-columns:1fr}
  .doc{padding:24px 18px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="rail-head">
      <img id="railLogo" alt="Logo de l'agence">
      <div><div class="t">Suivi de chantier</div><div class="s" id="railAgence">Comptes rendus de réunion</div></div>
    </div>
    <div class="rail-tools">
      <button class="btn primary" id="btnNew" style="justify-content:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Opération</button>
      <label class="btn" style="justify-content:center" title="Ouvrir un fichier d'opération .pv">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg>Ouvrir opération<input type="file" accept=".pv,.agoarv,application/json" hidden id="openAgoarv"></label>
    </div>
    <div class="rail-cur" id="railCur"></div>
    <div style="flex:1"></div>
    <div class="rail-foot"><div style="display:grid;gap:2px"><span id="storeInfo">Connexion…</span><span id="appVer"></span></div><div style="display:flex;gap:4px"><button class="btn ghost sm" id="btnSettings" title="Paramètres de l'agence">Agence</button></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>

/* ---------------- store (db or local) ---------------- */
const Store = {
  mode: "local", mem: {}, listeners: {},
  async init() {
    if (hasRuntime) {
      const [db, assets, mcp, downloads, user] = await Promise.all(["db", "assets", "mcp", "downloads", "user"].map(n => window.claude.use(n).catch(() => null)));
      Object.assign(CAP, { db, assets, mcp, downloads, user });
    }
    if (CAP.db) { this.mode = "db"; return; }
    if (NATIVE) { this.mode = "native"; this.mem = window.agoa.loadData() || {}; window.addEventListener("beforeunload", () => this.flush()); return; }
    try { this.mem = JSON.parse(localStorage.getItem("suivi-chantier-v1") || "{}"); } catch { this.mem = {}; }
  },
  flush() { if (this.mode === "native" && this._dirty) { this._dirty = false; clearTimeout(this._t); window.agoa.saveData(JSON.stringify(this.mem)); } },
  persist() {
    if (this.mode === "native") { clearTimeout(this._t); this._dirty = true; this._t = setTimeout(() => this.flush(), 400); scheduleFileSave(); return; }
    try { localStorage.setItem("suivi-chantier-v1", JSON.stringify(this.mem)); } catch {} },
  parent(path) { return path.split("/").slice(0, -1).join("/"); },
  notify(col) { (this.listeners[col] || []).forEach(fn => fn(this.localCol(col))); },
  localCol(col) { const depth = col.split("/").length + 1; return Object.keys(this.mem).filter(k => k.startsWith(col + "/") && k.split("/").length === depth).map(k => ({ id: k.split("/").pop(), ...this.mem[k] })); },
  watchCol(col, cb) {
    if (this.mode === "db") return CAP.db.collection(col).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn(e); setInfo("Erreur de synchronisation : " + (e.code || "")); });
    (this.listeners[col] ||= []).push(cb); setTimeout(() => cb(this.localCol(col)), 0);
    return () => { this.listeners[col] = (this.listeners[col] || []).filter(f => f !== cb); };
  },
  watchDoc(path, cb) {
    if (this.mode === "db") return CAP.db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), () => {});
    const col = this.parent(path), id = path.split("/").pop();
    return this.watchCol(col, rows => cb(rows.find(r => r.id === id) || null));
  },
  async getCol(col) { if (this.mode === "db") { const s = await CAP.db.collection(col).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); } return this.localCol(col); },
  async set(path, data) { if (this.mode === "db") return CAP.db.doc(path).set(data); this.mem[path] = JSON.parse(JSON.stringify(data)); this.persist(); this.notify(this.parent(path)); },
  async update(path, data) { if (this.mode === "db") return CAP.db.doc(path).update(data); this.mem[path] = { ...(this.mem[path] || {}), ...JSON.parse(JSON.stringify(data)) }; this.persist(); this.notify(this.parent(path)); },
  async del(path) { if (this.mode === "db") return CAP.db.doc(path).delete(); delete this.mem[path]; this.persist(); this.notify(this.parent(path)); }
};

function realAt(p) { const ks = Object.keys(p.events || {}).filter(k => p.events[k] === "realise").map(Number); return ks.length ? Math.min(...ks) : null; }
function ptState(p, n) {
  if (p.pv > n) return null;

  const e = (p.events || {})[n];

function lastFlag(p, n) { for (let k = n - 1; k >= p.pv; k--) { const e = (p.events || {})[k]; if (e === "urgent" || e === "rappel") return e; } return null; }
const TAG = {
  realise: '<span class="tag ok">Réalisé</span>',
  past: '<span class="tag ok">Réalisé</span>',
  rappel: '<span class="tag warn">Rappel</span>',
  urgent: '<span class="tag urg">Rappel urgent</span>',
  new: '<span class="tag new">Nouveau</span>',
  open: '<span class="tag open">En cours</span>'

/* ---------------- boot ---------------- */
(async function boot() {

  await Store.init();

  if (NATIVE) window.agoa.onOpenFile((name, text, path) => importAgoarv({ name, text: async () => text }, path));
  Store.watchDoc("config/agence", a => { S.cfg = { defaut: "rt", ...(a || {}) }; if (a && a.nom && !(a.profils || {}).tk) S.cfg.profils = { ...(a.profils || {}), tk: { nom: a.nom, lignes: a.lignes, logo: a.logo || "" } }; $("#railAgence").textContent = "AGOA — Procès-verbaux"; scheduleMain(); });
  Store.watchCol("dossiers", rows => { S.dossiers = rows; renderList(); if (S.cur && !D()) { S.cur = null; } scheduleMain(); });
  bindShell();
  $("#appVer").textContent = `${APP.nom} v${APP.version} · déploiement n°${APP.deploiement}`;

})();

function busy() { const a = document.activeElement; return S.ptr || !!(a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== "checkbox" && a.type !== "file"); }
function scheduleMain() { if (busy()) { S.pending = true; return; } renderMain(); }
function flushMain() { if (S.pending && !busy()) { S.pending = false; renderMain(); } }
document.addEventListener("pointerdown", () => { S.ptr = true; }, true);
document.addEventListener("pointerup", () => setTimeout(() => { S.ptr = false; flushMain(); }, 0), true);
document.addEventListener("pointercancel", () => { S.ptr = false; }, true);

/* ---------------- list ---------------- */
function renderList() {
  const d = D(); const el = $("#railCur"); if (!el) return;
  el.innerHTML = d ? `<div class="small muted" style="margin-bottom:4px">Opération ouverte</div><div class="c">${esc(d.code)}</div><div class="o">${esc(d.objet || d.adresse || "")}</div>${NATIVE && d.fichier ? `<div class="m" title="${esc(d.fichier)}">${esc(d.fichier.split(/[\\/]/).pop())}</div>` : ""}<button class="btn ghost sm" data-close-op style="margin-top:6px;padding-left:0">Fermer l'opération</button>` : "";

}
async function closeOperation() {

  S.unsub.forEach(u => { try { u(); } catch {} }); S.unsub = []; S.cur = null; renderList(); renderMain();
}

  main.addEventListener("change", onMainChange);
  main.addEventListener("keydown", e => { const t = e.target; if (t.dataset && t.dataset.todoAdd && e.key === "Enter") { e.preventDefault(); const v = t.value.trim(); if (!v) return; const p = S.points.find(x => x.id === t.dataset.todoAdd); t.value = ""; setTodo(p.id, [...(p.todo || []), { id: uid(), t: v, done: false }]).then(() => setTimeout(() => main.querySelector(`[data-todo-add="${p.id}"]`)?.focus(), 40)); } });
  main.addEventListener("focusout", () => setTimeout(flushMain, 30));
}

function openDossier(id) {
  S.unsub.forEach(u => { try { u(); } catch {} }); S.unsub = [];
  S.cur = id; S.pvSel = null; S.pvs = []; S.points = []; S.photos = []; S.docs = []; S.planSel = null; S.rep = null; S.edit = null; S.tab = "reunion";

/* ---------- Réunion ---------- */
function viewReunion(d) {
  const pvs = sortedPvs(); const pv = curPv();
  if (!ints(d).length) return `<div class="sec"><div class="sec-b"><p>Ajoutez d'abord les intervenants du chantier (architecte, maître d'ouvrage, entreprises avec leur numéro de lot).</p><button class="btn primary" data-tab="intervenants">Ouvrir les intervenants</button></div></div>`;
  if (!pv) return `<div class="sec"><div class="sec-b"><p style="margin-top:0">Aucune réunion pour ce dossier. Créez la réunion n°1 depuis l'onglet PV.</p><button class="btn primary" data-tab="crs">Aller aux PV</button></div></div>`;
  const n = pv.num; const ro = pv.statut === "diffuse"; const latest = pv === pvs[pvs.length - 1];
  const dis = ro ? "disabled" : "";
  const pres = pv.presence || {};
  const pr = pv.prochaine || {};
  const visible = S.points.filter(p => ptState(p, n));
  const counts = { realise: 0, past: 0, rappel: 0, urgent: 0, new: 0, open: 0 }; visible.forEach(p => counts[ptState(p, n)]++);
  return `
  <div class="pv-bar">

      ${pvs.length > 1 ? `<select data-act="pv-sel" aria-label="Choisir un compte rendu" style="width:auto">${pvs.map(p => `<option value="${p.id}" ${p.id === pv.id ? "selected" : ""}>CR n°${p.num} — ${fmt(p.date)}</option>`).join("")}</select>` : ""}
    </div>
    ${ro ? `<span class="small muted">PV diffusé, en lecture seule — rouvrez-le depuis l'onglet PV pour le modifier.</span>` : ""}
  </div>

  <section class="sec">
    <div class="sec-h"><h3>En-tête du compte rendu</h3></div>
    <div class="sec-b grid3">
      <label class="f">Date de la réunion<input type="date" data-pv-field="date" value="${esc(pv.date || "")}" ${dis}></label>
      <label class="f">Transmis le<input type="date" data-pv-field="transmis" value="${esc(pv.transmis || "")}" ${dis}></label>
      <label class="f">Numéro<input type="number" min="1" data-pv-field="num" value="${n}" disabled></label>

      <tbody>${ints(d).map(i => { const p = pres[i.id] || { c: i.convoque !== false, p: false, n: i.convoque !== false }; return `
        <tr><td><span class="lot" style="background:${lotColor(i.lot)}">${esc(i.lot)}</span></td>
        <td><div style="display:flex;gap:8px;align-items:center">${i.logo ? `<img class="ilogo" src="${i.logo}" alt="">` : ""}<div><b>${esc(i.nom)}</b><div class="small muted">${esc(i.role || "")}${i.contact ? " — " + esc(i.contact) : ""}</div></div></div></td>
        <td class="small">${esc(i.tel || "")}<br>${esc(i.email || "")}</td>
        ${["c", "p", "n"].map(k => `<td class="c"><input type="checkbox" class="chk" data-pres="${i.id}:${k}" ${p[k] ? "checked" : ""} ${dis} aria-label="${({ c: "Convoqué", p: "Présent", n: "Prochaine réunion" })[k]} — ${esc(i.nom)}"></td>`).join("")}</tr>`; }).join("")}
      </tbody></table></div>
  </section>

  <section class="sec">
    <div class="sec-h"><h3>Prochaine réunion</h3><span class="hint">${esc(d.reunionTexte || "")}</span></div>

  </section>

  <section class="sec">
    <div class="sec-h"><h3>Avancement lot par lot</h3>
      <span class="hint">${counts.new} nouveau${counts.new > 1 ? "x" : ""} · ${counts.open} en cours · ${counts.rappel} rappel${counts.rappel > 1 ? "s" : ""} · ${counts.urgent} urgent${counts.urgent > 1 ? "s" : ""} · ${counts.realise} réalisé${counts.realise > 1 ? "s" : ""} cette semaine · ${counts.past} traité${counts.past > 1 ? "s" : ""} auparavant</span></div>

function plansSection(pv) {
  const n = pv.num; const pl = plans();
  if (!pl.length) return "";
  const blocks = pl.map(x => { const pts = S.points.filter(p => p.pin && p.pin.planId === x.id && ["new", "open", "rappel", "urgent", "realise"].includes(ptState(p, n))); return `<div style="display:grid;gap:6px"><div class="small"><b>${esc(x.nom)}</b> — ${pts.length} point(s)</div><div class="plan-stage"><div class="plan-wrap"><img src="${esc(docSrc(x))}" alt="${esc(x.nom)}" loading="lazy">${pinsSVG(x, pts, n, { clickable: true })}</div></div></div>`; }).join("");
  return `<section class="sec"><div class="sec-h"><h3>Localisation sur plans</h3><button class="btn sm" data-tab="plans">Gérer les plans</button></div><div class="sec-b" style="display:grid;gap:16px">${blocks}<p class="small muted" style="margin:0">Cliquez sur une pastille pour aller au point.</p></div></section>`;
}

function lotBlocks(d, pv, ro) {
  const n = pv.num; const list = ints(d);
  const known = new Set(list.map(i => i.id));
  const orphans = S.points.filter(p => !known.has(p.intId) && ptState(p, n));
  const blocks = list.map(i => {
    const all = S.points.filter(p => p.intId === i.id && ptState(p, n)).sort((a, b) => (a.seq - b.seq));
    const pts = all.filter(p => !["past", "realise"].includes(ptState(p, n))), past = [...all.filter(p => ptState(p, n) === "past"), ...all.filter(p => ptState(p, n) === "realise")];
    const refs = S.points.filter(p => p.intId !== i.id && (p.also || []).includes(i.id) && ["new", "open", "rappel", "urgent"].includes(ptState(p, n)));
    return `<div class="lot-block">
      <div class="lot-head"><span class="lot" style="background:${lotColor(i.lot)}">${esc(i.lot)}</span>${i.logo ? `<img class="ilogo" src="${i.logo}" alt="">` : ""}
        <div><div class="n">${esc(i.nom)}</div><div class="r">${esc(i.role || "")}</div></div><span class="sp"></span>
        ${ro ? "" : `<button class="btn sm" data-act="pt-new" data-int="${i.id}">${ICON.plus}Point</button>`}</div>
      <div class="lot-points">${pts.length ? pts.map(p => pointCard(p, pv, ro)).join("") : (refs.length ? "" : `<div class="lot-none">${past.length ? "Aucun point en cours" : "Sans objet"}</div>`)}
      ${past.length ? `<div class="past-h">Points traités (${past.length})</div>${past.map(p => pointCard(p, pv, ro)).join("")}` : ""}
      ${refs.map(p => `<button class="ref" data-act="goto-pt" data-id="${p.id}">Concerné aussi par <span class="pnum" style="background:${lotColor(p.lot)}">${esc(p.num)}</span> ${esc(p.titre)}</button>`).join("")}
      ${S.edit && S.edit.mode === "new" && S.edit.intId === i.id ? pointForm(null, i) : ""}</div></div>`;
  });
  if (orphans.length) blocks.push(`<div class="lot-block"><div class="lot-head"><div class="n">Intervenant supprimé</div></div><div class="lot-points">${orphans.map(p => pointCard(p, pv, ro)).join("")}</div></div>`);
  return blocks.join("");
}

function photosOf(pid) { return S.photos.filter(ph => ph.pointId === pid).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); }
const phSrc = (ph) => ph.assetId ? "/_blob/" + ph.assetId : ph.dataUrl;
function shapesSVG(ph, cls = "ov") {
  const w = ph.w || 1000, h = ph.h || 750, sw = Math.max(w, h) / 160;
  const sh = (ph.shapes || []).map(s => shapeMarkup(s, sw)).join("");
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${sh}</svg>`;
}
function shapeMarkup(s, sw) {
  const col = "#E10600";
  if (s.t === "rect") { const x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2); return `<rect x="${x}" y="${y}" width="${Math.abs(s.x2 - s.x1)}" height="${Math.abs(s.y2 - s.y1)}" fill="none" stroke="${col}" stroke-width="${sw}"/>`; }
  if (s.t === "ellipse") return `<ellipse cx="${(s.x1 + s.x2) / 2}" cy="${(s.y1 + s.y2) / 2}" rx="${Math.abs(s.x2 - s.x1) / 2}" ry="${Math.abs(s.y2 - s.y1) / 2}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  if (s.t === "free") return `<polyline points="${(s.pts || []).map(p => p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (s.t === "text") { const fs = sw * 7; return `<text x="${s.x1}" y="${s.y1}" font-family="Archivo, Arial, sans-serif" font-weight="700" font-size="${fs}" fill="${col}" stroke="#fff" stroke-width="${fs / 6}" paint-order="stroke" dominant-baseline="middle">${esc(s.txt || "")}</text>`; }
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hl = Math.min(sw * 5, L * .6), hw = hl * .55;
  const bx = s.x2 - ux * hl, by = s.y2 - uy * hl;
  return `<line x1="${s.x1}" y1="${s.y1}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/><polygon points="${s.x2},${s.y2} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}" fill="${col}"/>`;
}

const plans = () => S.docs.filter(x => x.kind === "plan").sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
const docSrc = (x) => x.assetId ? "/_blob/" + x.assetId : x.dataUrl;
const STCOL = { realise: "#2E7D32", rappel: "#D9730D", urgent: "#B00020", new: "#25587F", open: "#5A6670" };
function pinsSVG(plan, pts, n, opts = {}) {
  const r = Math.max(plan.w, plan.h) / 75;
  const marks = pts.map(p => {
    const st = ptState(p, n) || "open"; const hi = opts.hi === p.id;
    const label = String(p.num); const w = Math.max(r * 2.1, r * .62 * label.length + r * .9);
    return `<g class="pin" data-act="${opts.clickable ? "goto-pt" : ""}" data-id="${p.id}" opacity="${opts.hi && !hi ? .45 : st === "realise" ? .55 : 1}" style="${opts.clickable ? "cursor:pointer" : ""}">
      <line x1="${p.pin.x}" y1="${p.pin.y}" x2="${p.pin.x}" y2="${p.pin.y - r * 1.6}" stroke="${STCOL[st]}" stroke-width="${r / 4}"/>
      <rect x="${p.pin.x - w / 2}" y="${p.pin.y - r * 2.7}" width="${w}" height="${r * 1.7}" rx="${r * .35}" fill="${lotColor(p.lot)}" stroke="${hi ? "#111" : STCOL[st]}" stroke-width="${r / (hi ? 3 : 5)}"/>
      <text x="${p.pin.x}" y="${p.pin.y - r * 1.85}" text-anchor="middle" dominant-baseline="middle" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="${r * 1.05}" fill="#fff">${esc(label)}</text>
      <circle cx="${p.pin.x}" cy="${p.pin.y}" r="${r / 3}" fill="${STCOL[st]}"/></g>`;
  }).join("");
  return `<svg class="${opts.cls || "ov"}" viewBox="0 0 ${plan.w} ${plan.h}" preserveAspectRatio="none">${marks}${opts.extra || ""}</svg>`;
}

function pointCard(p, pv, ro) {
  const n = pv.num; const st = ptState(p, n); const col = lotColor(p.lot); const d = D();
  if (S.edit && S.edit.mode === "edit" && S.edit.id === p.id && !ro) return pointForm(p, null);
  const late = isLate(p, pv, st);
  const due = p.echeance ? `<span class="tag due ${late ? "late" : ""}">${late ? "Échéance dépassée " : "Échéance "}${fmt(p.echeance)}</span>` : "";
  const tag = p.memo && (st === "new" || st === "open") ? '<span class="tag memo">Pour mémoire</span>' : TAG[st];
  if (st === "past") { const r = realAt(p); return `<div class="pt s-realise collapsed past" id="pt-${p.id}"><div class="pt-h"><span class="pnum" style="background:${col}">${esc(p.num)}</span><span class="ttl">${esc(p.titre)}</span><span class="tag ok">${p.memo ? "Clos" : "Réalisé"}</span><span class="small muted">PV n°${r}</span></div></div>`; }
  if (st === "realise") return `<div class="pt s-realise collapsed" id="pt-${p.id}"><div class="pt-h"><span class="pnum" style="background:${col}">${esc(p.num)}</span><span class="ttl">${esc(p.titre)}</span>${p.memo ? '<span class="tag ok">Clos</span>' : TAG.realise}${ro ? "" : `<button class="btn ghost sm" data-act="pt-decide" data-id="${p.id}" data-v="">Annuler</button>`}</div></div>`;
  const older = p.pv < n;
  const prev = older ? lastFlag(p, n) : null;
  const notes = Object.keys(p.notes || {}).map(Number).filter(k => k < n && p.notes[k]).sort((a, b) => a - b);
  const phs = photosOf(p.id);
  const byId = Object.fromEntries((d.intervenants || []).map(i => [i.id, i]));
  const also = (p.also || []).map(id => byId[id]).filter(Boolean);
  const plan = p.pin && S.docs.find(x => x.id === p.pin.planId);
  const todo = p.todo || [];
  const hist = [`Créé au CR n°${p.pv}`].concat(Object.keys(p.events || {}).map(Number).filter(k => k < n).sort((a, b) => a - b).map(k => `${({ rappel: "rappel", urgent: "rappel urgent", realise: "réalisé" })[p.events[k]] || p.events[k]} au CR n°${k}`)).join(" · ");
  return `<div class="pt s-${st === "new" ? (p.memo ? "memo" : "new") : (p.memo && st === "open" ? "memo" : st)}" id="pt-${p.id}">
    <div class="pt-h"><span class="pnum" style="background:${col}">${esc(p.num)}</span><span class="ttl">${esc(p.titre)}</span>${tag}${due}

let pdfLib = null;
function loadPdfJs() {
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); }; s.onerror = () => { pdfLib = null; rej(new Error("pdf.js indisponible")); }; document.head.appendChild(s); });
  return pdfLib;
}
async function pdfFirstPage(file, max) {
  const lib = await loadPdfJs(); const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise; const page = await doc.getPage(1);
  const v0 = page.getViewport({ scale: 1 }); const sc = max / Math.max(v0.width, v0.height); const v = page.getViewport({ scale: sc });
  const c = document.createElement("canvas"); c.width = Math.round(v.width); c.height = Math.round(v.height); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: x, viewport: v }).promise; return c;
}
async function uploadPlan(file) {
  toast("Import du plan…", 1800);
  try {
    const big = !!CAP.assets; const max = big || NATIVE ? 2600 : 1400;
    let canvas;
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) canvas = await pdfFirstPage(file, max);
    else canvas = (await resize(file, max, "image/jpeg", .85)).canvas;
    const nom = file.name.replace(/\.[^.]+$/, "");
    let doc = { kind: "plan", nom, w: canvas.width, h: canvas.height, mime: "image/jpeg", createdAt: Date.now() };
    if (big) { const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", .85)); doc.assetId = (await CAP.assets.upload(blob, { type: "image/jpeg" })).id; }
    else { let q = .6, url; do { url = canvas.toDataURL("image/jpeg", q); q -= .1; } while (url.length > LIM && q > .15); doc.dataUrl = url; }
    const id = uid(); await Store.set(dPath() + "/docs/" + id, doc); S.planSel = id; toast("Plan ajouté");
  } catch (e) { console.warn(e); toast(/pdf/i.test(e.message || "") ? "Lecture du PDF impossible : exportez la page en image (PNG/JPG)." : "Import impossible : " + (e.code || e.message || "erreur"), 4500); }
}
async function uploadDoc(file) {
  try {
    const type = file.type || ({ md: "text/markdown", json: "application/json", csv: "text/csv", txt: "text/plain", pdf: "application/pdf" })[(file.name.split(".").pop() || "").toLowerCase()] || "";
    let doc = { kind: "doc", nom: file.name, mime: type, size: file.size, createdAt: Date.now() };
    if (CAP.assets) doc.assetId = (await CAP.assets.upload(file, { type })).id;
    else { if (!NATIVE && file.size > 170000) { toast("En mode local, les documents sont limités à 170 Ko."); return; } doc.dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); }); }
    await Store.set(dPath() + "/docs/" + uid(), doc); toast(`${file.name} ajouté`);
  } catch (e) { toast(e && e.code === "invalid_request" ? "Type de fichier non accepté (PDF, images, texte, CSV)." : "Ajout impossible : " + (e.code || e.message || "erreur"), 4000); }
}
async function downloadDoc(x) {
  try {
    const blob = x.dataUrl ? await (await fetch(x.dataUrl)).blob() : await (await fetch(docSrc(x))).blob();
    const ext = (x.nom.match(/\.[a-z0-9]+$/i) || [""])[0] || ({ "application/pdf": ".pdf", "image/jpeg": ".jpg", "image/png": ".png" })[x.mime] || "";
    const filename = x.nom.endsWith(ext) ? x.nom : x.nom + ext;
    if (CAP.downloads) await CAP.downloads.save({ filename, data: blob });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Téléchargement impossible : " + (e.code || "erreur")); }
}

function gantt(d, forDoc) {
  const rows = [...(d.planning || [])].filter(r => r.debut).sort((a, b) => a.debut.localeCompare(b.debut));
  if (!rows.length) return "";
  const start = mondayOf(rows.reduce((m, r) => r.debut < m ? r.debut : m, rows[0].debut));
  const endIso = rows.reduce((m, r) => (r.fin || r.debut) > m ? (r.fin || r.debut) : m, rows[0].fin || rows[0].debut);
  const weeks = []; for (let w = start; w <= endIso && weeks.length < 60; w = addDays(w, 7)) weeks.push(w);
  const today = todayISO(); const byId = Object.fromEntries((d.intervenants || []).map(i => [i.id, i]));
  const head = weeks.map(w => `<th title="Semaine du ${fmt(w)}">S${isoWeek(w)}${forDoc ? "" : `<br><span style="font-weight:400">${fmt(w).slice(0, 5)}</span>`}</th>`).join("");
  const body = rows.map(r => {
    const i = byId[r.intId]; const col = i ? lotColor(i.lot) : "#5A6670"; const f = r.fin || r.debut;
    const cells = weeks.map(w => {
      const we = addDays(w, 6); if (f < w || r.debut > we) return `<td class="w ${today >= w && today <= we ? "now" : ""}"></td>`;
      const a = r.debut > w ? (new Date(r.debut) - new Date(w)) / 864e5 : 0;
      const b = f < we ? (new Date(f) - new Date(w)) / 864e5 + 1 : 7;
      return `<td class="w ${today >= w && today <= we ? "now" : ""}"><span class="bar" style="left:${a / 7 * 100}%;right:${100 - b / 7 * 100}%;background:${col}"></span></td>`;
    }).join("");
    return `<tr><td class="${forDoc ? "l" : "lbl"}">${i ? `<span class="lot" style="background:${col};min-width:18px;height:18px;font-size:11px;margin-right:6px">${esc(i.lot)}</span>` : ""}${esc(r.libelle || (i ? i.nom : ""))}</td>${cells}</tr>`;
  }).join("");
  return forDoc ? `<table class="gt"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table>`
    : `<div class="gantt"><table><thead><tr><th class="lbl">Tâche</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

  const pvs = sortedPvs().reverse(); const next = (pvs[0]?.num || 0) + 1;
  const newBtn = ints(d).length ? `<button class="btn primary" data-act="new-pv">${ICON.plus}Nouvelle réunion (PV n°${next})</button>` : `<button class="btn" data-tab="intervenants">Ajouter d'abord les intervenants</button>`;
  if (!pvs.length) return `<section class="sec"><div class="sec-h"><h3>PV</h3>${newBtn}</div><div class="sec-b muted">Aucun PV pour l'instant. La première réunion crée le PV n°1 avec la liste des intervenants convoqués.</div></section>`;
  return `<section class="sec"><div class="sec-h"><h3>PV</h3>${newBtn}</div><div class="scroll-x"><table class="t">
    <thead><tr><th>N°</th><th>Réunion du</th><th>Transmis le</th><th>Statut</th><th>Points</th><th></th></tr></thead><tbody>
    ${pvs.map((p, idx) => { const v = S.points.filter(x => ptState(x, p.num)); const c = s => v.filter(x => ptState(x, p.num) === s).length; return `<tr>
      <td><b>${p.num}</b></td><td>${fmt(p.date)}</td><td>${fmt(p.transmis) || "—"}</td>
      <td><span class="state ${p.statut === "diffuse" ? "sent" : "draft"}">${p.statut === "diffuse" ? "Diffusé" : "Brouillon"}</span></td>
      <td class="small">${c("new")} nouv. · ${c("rappel") + c("urgent")} rappels · ${c("realise")} réalisés</td>
      <td style="white-space:nowrap"><button class="btn sm" data-act="pv-open" data-pv="${p.id}">Ouvrir</button> <button class="btn sm" data-act="preview" data-pv="${p.id}">${ICON.print}Aperçu</button> ${p.statut === "diffuse" ? `<button class="btn sm" data-act="pv-reopen" data-pv="${p.id}">Rouvrir</button>` : `<button class="btn sm ok-b" data-act="pv-close" data-pv="${p.id}">Marquer comme diffusé</button>`} ${idx === 0 ? `<button class="btn ghost sm danger" data-act="pv-del" data-pv="${p.id}">Supprimer</button>` : ""}</td></tr>`; }).join("")}
  </tbody></table></div></section>`;
}

/* ---------- Dossier ---------- */
function viewDossier(d) {
  const F = (k, l, t = "text") => `<label class="f">${l}<input type="${t}" data-dfield="${k}" value="${esc(d[k] || "")}"></label>`;
  return `<section class="sec"><div class="sec-h"><h3>Informations du dossier</h3>${d.ragicId ? `<span class="hint">Opération Ragic n°${esc(d.ragicId)}</span>` : ""}</div>
    <div class="sec-b" style="display:grid;gap:12px">
      <div class="grid2">${F("code", "Code travaux")}${F("objet", "Objet")}</div>
      <div class="grid2">${F("adresse", "Adresse du chantier")}${F("moa", "Maître d'ouvrage")}</div>
      <div class="grid2">${F("syndic", "Syndic")}${F("gestionnaire", "Gestionnaire")}</div>
      <label class="f">En-tête et logo du PV<select data-act-ag>${Object.keys(PROFILS).map(k => `<option value="${k}" ${prof(d).key === k ? "selected" : ""}>${esc(PROFILS[k].label)}</option>`).join("")}</select></label>
      <label class="f">Rythme des réunions (repris sur le compte rendu)<input type="text" data-dfield="reunionTexte" value="${esc(d.reunionTexte || "")}" placeholder="Les réunions de chantier se tiennent tous les lundis à 14h"></label>
      <label class="f">Mention de diffusion<textarea data-dfield="diffusion" rows="2">${esc(d.diffusion ?? DIFFUSION)}</textarea></label>
    </div></section>
  ${NATIVE ? `<section class="sec"><div class="sec-h"><h3>Fichier du dossier</h3></div><div class="sec-b small">${d.fichier ? `Enregistré automatiquement dans <b>${esc(d.fichier)}</b>` : `<span style="color:var(--warn)">Ce dossier n'est enregistré dans aucun fichier .pv.</span> Utilisez « Enregistrer sous… » ci-dessous.`}</div></section>` : ""}
  <section class="sec"><div class="sec-h"><h3>Classement</h3></div>
    <div class="sec-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      ${d.statut === "archive" ? `<button class="btn" data-act="d-unarchive">Remettre en cours</button>` : `<button class="btn" data-act="d-archive">Archiver le dossier</button>`}
      <button class="btn" data-act="d-export">${ICON.dl}${NATIVE ? "Enregistrer sous… (.pv)" : "Télécharger le dossier (.pv)"}</button>
      <button class="btn danger" data-act="d-delete">Supprimer le dossier…</button>
      <span class="small muted">L'archivage retire le dossier de la liste « En cours » sans rien effacer. La suppression efface les comptes rendus, points et photos.</span>
    </div></section>`;
}

/* ---------------- events ---------------- */
async function onMainClick(e) {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.edit = null; renderMain(); $("#main").scrollTop = 0; return; }
  const a = t.dataset.act; const d = D();
  const act = {
    "new-dossier": openNewDossier,
    "new-pv": () => newPv().then(() => { S.tab = "reunion"; renderMain(); $("#main").scrollTop = 0; }),
    "pv-close": () => { const pv = S.pvs.find(x => x.id === t.dataset.pv) || curPv(); updPv(pv, { statut: "diffuse", transmis: pv.transmis || todayISO() }); },
    "pv-reopen": () => { const pv = S.pvs.find(x => x.id === t.dataset.pv) || curPv(); updPv(pv, { statut: "brouillon" }); },
    "pv-open": () => { S.pvSel = t.dataset.pv; S.tab = "reunion"; renderMain(); },
    "pv-del": () => delPv(t.dataset.pv),
    "preview": () => openPreview(t.dataset.pv),
    "pt-new": () => { S.edit = { mode: "new", intId: t.dataset.int }; renderMain(); setTimeout(() => $('[data-form="new"] [data-pf="titre"]')?.focus(), 30); },
    "pt-edit": () => { S.edit = { mode: "edit", id: t.dataset.id }; renderMain(); },
    "pt-cancel": () => { S.edit = null; renderMain(); },
    "pt-save": () => savePoint(t.closest(".pform")),
    "pt-del": () => delPoint(t.dataset.id),
    "pt-decide": () => decide(t.dataset.id, t.dataset.v),
    "ph-open": () => openAnno(t.dataset.id, curPv()?.statut === "diffuse"),
    "int-add": () => addInt(),
    "int-del": () => delInt(t.dataset.id),
    "int-logo-del": () => setIntField(t.dataset.id, "logo", ""),
    "ragic-complete": () => ragicComplete(false),
    "ragic-planning": () => ragicComplete(true),
    "plan-add": () => saveDossier({ planning: [...(d.planning || []), { id: uid(), intId: "", libelle: "", debut: todayISO(), fin: addDays(todayISO(), 13) }] }),
    "plan-del": () => saveDossier({ planning: (d.planning || []).filter(r => r.id !== t.dataset.id) }),
    "d-archive": () => saveDossier({ statut: "archive" }).then(() => toast("Dossier archivé")),
    "d-unarchive": () => saveDossier({ statut: "actif" }).then(() => toast("Dossier remis en cours")),
    "d-delete": () => deleteDossier(),
    "d-export": () => exportAgoarv(),
    "ent-search": () => openEntSearch(),
    "goto-pt": () => gotoPoint(t.dataset.id),
    "pt-pin": () => openPinner(t.dataset.id, false),
    "pin-view": () => openPinner(t.dataset.id, true),
    "plan-sel": () => { S.planSel = t.dataset.id; renderMain(); },
    "doc-dl": () => { const x = S.docs.find(y => y.id === t.dataset.id); if (x) downloadDoc(x); },
    "doc-del": () => delDoc(t.dataset.id),
    "todo-del": () => { const p = S.points.find(x => x.id === t.dataset.id); if (p) setTodo(p.id, (p.todo || []).filter(x => x.id !== t.dataset.t)); }
  }[a];
  if (act) { e.preventDefault(); act(); }
}

async function onMainChange(e) {
  const t = e.target; const d = D(); if (!d) return;
  const ds = t.dataset; const pv = curPv();
  if (t.dataset.act === "pv-sel") { S.pvSel = t.value; S.edit = null; renderMain(); return; }
  if (ds.pvField) return updPv(pv, { [ds.pvField]: t.value });
  if (ds.prochaine) return updPv(pv, { prochaine: { ...(pv.prochaine || {}), [ds.prochaine]: t.value } });
  if (ds.pres) { const [iid, k] = ds.pres.split(":"); const i = (d.intervenants || []).find(x => x.id === iid); const base = (pv.presence || {})[iid] || { c: i?.convoque !== false, p: false, n: i?.convoque !== false }; return updPv(pv, { presence: { ...(pv.presence || {}), [iid]: { ...base, [k]: t.checked } } }); }
  if (ds.note) { const p = S.points.find(x => x.id === ds.note); return safe(Store.update(dPath() + "/points/" + p.id, { notes: { ...(p.notes || {}), [pv.num]: t.value } })); }
  if (ds.upload) { const files = [...t.files]; t.value = ""; for (const f of files) await (ds.upload === "plan" ? uploadPlan(f) : uploadDoc(f)); return; }
  if (ds.docname) { const x = S.docs.find(y => y.id === ds.docname); const v = t.value.trim(); if (x && v) { x.nom = v; return safe(Store.update(dPath() + "/docs/" + x.id, { nom: v })); } return; }
  if (ds.todo) { const [pid, tid] = ds.todo.split(":"); const p = S.points.find(x => x.id === pid); return setTodo(pid, (p.todo || []).map(x => x.id === tid ? { ...x, done: t.checked } : x)); }
  if (ds.photos) { const files = [...t.files]; t.value = ""; return addPhotos(ds.photos, files); }
  if (ds.intF) { const [iid, k] = ds.intF.split(":"); return setIntField(iid, k, t.type === "checkbox" ? t.checked : t.value.trim()); }
  if (ds.intLogo) { const f = t.files[0]; t.value = ""; if (f) { const url = await imgToDataUrl(f, 240, "image/png"); setIntField(ds.intLogo, "logo", url); } return; }
  if (ds.plan) { const [rid, k] = ds.plan.split(":"); return saveDossier({ planning: (d.planning || []).map(r => r.id === rid ? { ...r, [k]: t.value } : r) }); }
  if ("actAg" in ds) { const old = prof(d).nom; const nw = prof({ agence: t.value }).nom; return saveDossier({ agence: t.value, intervenants: (d.intervenants || []).map(i => i.nom === old ? { ...i, nom: nw } : i) }); }
  if (ds.dfield) return saveDossier({ [ds.dfield]: t.type === "checkbox" ? t.checked : t.value });
}

/* ---------------- mutations ---------------- */
async function saveDossier(patch) { const d = D(); if (!d) return; Object.assign(d, patch); renderList(); scheduleMain(); return safe(Store.update(dPath(), { ...patch, updatedAt: Date.now() })); }
async function updPv(pv, patch) { if (!pv) return; Object.assign(pv, patch); scheduleMain(); return safe(Store.update(dPath() + "/pvs/" + pv.id, patch)); }

async function newPv() {
  const d = D(); const list = sortedPvs(); const prev = list[list.length - 1];
  const num = prev ? prev.num + 1 : 1;
  const date = prev?.prochaine?.date || todayISO();
  const presence = {}; (d.intervenants || []).forEach(i => { const pn = prev?.presence?.[i.id]; const c = pn ? !!pn.n : i.convoque !== false; presence[i.id] = { c, p: false, n: c }; });
  const pv = { num, date, transmis: "", presence, prochaine: { date: addDays(date, 7), heure: prev?.prochaine?.heure || "", lieu: prev?.prochaine?.lieu || "Sur site" }, commentaires: "", statut: "brouillon", createdAt: Date.now() };
  if (prev && prev.statut !== "diffuse") await updPv(prev, { statut: "diffuse", transmis: prev.transmis || todayISO() });
  await safe(Store.set(dPath() + "/pvs/" + pvId(num), pv));
  S.pvSel = pvId(num); S.edit = null;
  await saveDossier({ lastPv: { num, date } });
  toast(`Réunion n°${num} créée`);
}
async function delPv(id) {
  const pv = S.pvs.find(p => p.id === id); if (!pv) return;
  const created = S.points.filter(p => p.pv === pv.num);
  if (!await askConfirm(`Supprimer le compte rendu n°${pv.num} ?`, `Les ${created.length} point(s) créés pendant cette réunion et leurs photos seront aussi supprimés. Les suites données aux points plus anciens lors de cette réunion seront effacées.`, "Supprimer")) return;
  for (const p of created) await removePoint(p);
  for (const p of S.points.filter(x => x.pv < pv.num && ((x.events || {})[pv.num] || (x.notes || {})[pv.num]))) {
    const ev = { ...(p.events || {}), [pv.num]: null }; const no = { ...(p.notes || {}), [pv.num]: null };
    await Store.update(dPath() + "/points/" + p.id, { events: ev, notes: no });
  }
  await safe(Store.del(dPath() + "/pvs/" + id));
  const rest = sortedPvs().filter(p => p.id !== id); const last = rest[rest.length - 1];
  S.pvSel = null; await saveDossier({ lastPv: last ? { num: last.num, date: last.date } : null });
  toast("Compte rendu supprimé");
}

async function savePoint(form) {
  const v = k => form.querySelector(`[data-pf="${k}"]`);
  const titre = v("titre").value.trim(); if (!titre) { v("titre").focus(); toast("Donnez un titre au point"); return; }
  const pv = curPv(); const n = pv.num; const d = D();
  const urgent = v("urgent")?.checked; const memo = !!v("memo")?.checked;
  const also = [...form.querySelectorAll("[data-also]")].filter(x => x.checked).map(x => x.dataset.also);
  if (form.dataset.form === "new") {
    const intId = v("intId").value; const it = (d.intervenants || []).find(i => i.id === intId);
    const lot = String(it?.lot ?? "0");
    const seq = Math.max(0, ...S.points.filter(p => String(p.lot) === lot).map(p => p.seq || 0)) + 1;
    const p = { num: `${lot}.${String(seq).padStart(2, "0")}`, lot, seq, intId, titre, texte: v("texte").value.trim(), echeance: v("echeance").value, memo, also, todo: [], pin: null, pv: n, events: urgent ? { [n]: "urgent" } : {}, notes: {}, createdAt: Date.now() };
    S.edit = null;
    await safe(Store.set(dPath() + "/points/" + uid(), p));
    toast(`Point ${p.num} créé`);
  } else {
    const p = S.points.find(x => x.id === form.dataset.form);
    const patch = { titre, texte: v("texte").value.trim(), echeance: v("echeance").value, memo, also };
    if (v("urgent")) { const ev = { ...(p.events || {}) }; if (urgent) ev[n] = "urgent"; else if (ev[n] === "urgent") ev[n] = null; patch.events = ev; }
    S.edit = null; Object.assign(p, patch); renderMain();
    await safe(Store.update(dPath() + "/points/" + p.id, patch));
  }
}
async function setTodo(pid, todo) { const p = S.points.find(x => x.id === pid); if (!p) return; p.todo = todo; scheduleMain(); await safe(Store.update(dPath() + "/points/" + pid, { todo })); }

async function removePoint(p) {
  for (const ph of photosOf(p.id)) { if (ph.assetId && CAP.assets) { try { await CAP.assets.delete(ph.assetId); } catch {} } await Store.del(dPath() + "/photos/" + ph.id); }
  await Store.del(dPath() + "/points/" + p.id);
}
async function delPoint(id) {
  const p = S.points.find(x => x.id === id);
  if (!await askConfirm(`Supprimer le point ${p.num} ?`, "Le point disparaît de tous les comptes rendus, avec ses photos. Son numéro ne sera pas réattribué.", "Supprimer")) return;
  S.edit = null; await safe(removePoint(p)); toast(`Point ${p.num} supprimé`);
}
async function decide(id, v) {
  const p = S.points.find(x => x.id === id); const n = curPv().num;
  const ev = { ...(p.events || {}) };
  if (!v || ev[n] === v) ev[n] = null; else ev[n] = v;
  p.events = ev; renderMain();
  await safe(Store.update(dPath() + "/points/" + id, { events: ev }));
}

function addInt() {
  const d = D(); const list = d.intervenants || [];
  const lot = String(Math.max(0, ...list.map(i => parseInt(i.lot, 10) || 0)) + 1);
  saveDossier({ intervenants: [...list, { id: uid(), lot, nom: "Nouvelle entreprise", role: "", contact: "", tel: "", email: "", logo: "", convoque: true }] });
}
function setIntField(iid, k, v) { const d = D(); saveDossier({ intervenants: (d.intervenants || []).map(i => i.id === iid ? { ...i, [k]: v } : i) }); }
async function delInt(iid) {
  const d = D(); const i = (d.intervenants || []).find(x => x.id === iid);
  const n = S.points.filter(p => p.intId === iid).length;
  if (!await askConfirm(`Retirer ${i.nom} ?`, n ? `${n} point(s) lui sont attribués : ils resteront visibles sous « Intervenant supprimé ».` : "Cet intervenant n'a aucun point.", "Retirer")) return;
  saveDossier({ intervenants: (d.intervenants || []).filter(x => x.id !== iid) });
}

async function deleteDossier() {
  const d = D();
  const ok = await askConfirm(`Supprimer définitivement ${d.code} ?`, "Tous les comptes rendus, points, photos et le planning de ce dossier seront effacés. Pour simplement le ranger, utilisez plutôt « Archiver ».", "Supprimer définitivement", d.code);
  if (!ok) return;
  const id = d.id; S.unsub.forEach(u => { try { u(); } catch {} }); S.unsub = [];
  try {
    for (const col of ["photos", "docs", "points", "pvs"]) {
      for (const r of await Store.getCol(dPath(id) + "/" + col)) { if ((col === "photos" || col === "docs") && r.assetId && CAP.assets) { try { await CAP.assets.delete(r.assetId); } catch {} } await Store.del(dPath(id) + "/" + col + "/" + r.id); }
    }
    await Store.del(dPath(id));
    S.cur = null; renderMain(); toast("Dossier supprimé");
  } catch (e) { toast("Suppression incomplète : " + (e.code || "erreur")); }
}

async function delDoc(id) {
  const x = S.docs.find(y => y.id === id); if (!x) return;
  const n = x.kind === "plan" ? S.points.filter(p => p.pin && p.pin.planId === id).length : 0;
  if (!await askConfirm(`Supprimer « ${x.nom} » ?`, n ? `${n} point(s) localisé(s) sur ce plan perdront leur pastille.` : "Le fichier sera définitivement retiré du dossier.", "Supprimer")) return;
  if (x.assetId && CAP.assets) { try { await CAP.assets.delete(x.assetId); } catch {} }
  await safe(Store.del(dPath() + "/docs/" + id));
  for (const p of S.points.filter(p => p.pin && p.pin.planId === id)) await Store.update(dPath() + "/points/" + p.id, { pin: null });
  if (S.planSel === id) S.planSel = null; toast("Supprimé");
}

/* ---------------- images ---------------- */
function loadImg(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); }; im.onerror = rej; im.src = u; }); }
async function resize(file, max, type, q) {
  const im = await loadImg(file); const r = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.round(im.naturalWidth * r), h = Math.round(im.naturalHeight * r);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); }
  x.drawImage(im, 0, 0, w, h);
  return { canvas: c, w, h, blob: await new Promise(r2 => c.toBlob(r2, type, q)) };
}
async function imgToDataUrl(file, max, type = "image/jpeg", q = .8) { const { canvas } = await resize(file, max, type, q); return canvas.toDataURL(type, q); }
async function addPhotos(pointId, files) {
  if (!files.length) return;
  toast(`Envoi de ${files.length} photo${files.length > 1 ? "s" : ""}…`, 1800);
  const pvN = curPv().num;
  for (const f of files) {
    try {
      let doc;
      if (CAP.assets) {
        const r = await resize(f, 1800, "image/jpeg", .84);
        const up = await CAP.assets.upload(r.blob, { type: "image/jpeg" });
        doc = { pointId, assetId: up.id, w: r.w, h: r.h };
      } else {
        let q = .7, url, r; do { r = await resize(f, DMAX, "image/jpeg", q); url = r.canvas.toDataURL("image/jpeg", q); q -= .12; } while (url.length > LIM && q > .2);
        doc = { pointId, dataUrl: url, w: r.w, h: r.h };
      }
      await Store.set(dPath() + "/photos/" + uid(), { ...doc, shapes: [], cap: "", pv: pvN, createdAt: Date.now() });
    } catch (e) { console.warn(e); toast("Photo non enregistrée : " + (e.code || e.message || "erreur")); }
  }
}

/* ---------------- annotation ---------------- */
function openAnno(phId, ro) {
  const ph = S.photos.find(x => x.id === phId); if (!ph) return;
  const st = { shapes: JSON.parse(JSON.stringify(ph.shapes || [])), tool: "arrow", draft: null };
  const L = $("#layer");
  const TOOLS = [["arrow", "Flèche"], ["rect", "Cadre"], ["ellipse", "Cercle"], ["free", "Main levée"], ["text", "Texte"]];
  L.innerHTML = `<div class="ov-bg" role="dialog" aria-modal="true" aria-label="Annoter la photo"><div class="modal wide">
    <div class="modal-h"><h3>${ro ? "Photo" : "Annoter la photo"}</h3><button class="btn ghost" data-x>Fermer</button></div>
    <div class="modal-b">
      ${ro ? "" : `<div class="toolbar"><div class="seg" role="group" aria-label="Outil">${TOOLS.map(([k, l], i) => `<button data-tool="${k}" aria-pressed="${i === 0}">${l}</button>`).join("")}</div>
        <input type="text" data-txt placeholder="Texte à placer" style="width:200px" hidden>
        <button class="btn sm" data-undo>Annuler le dernier tracé</button><button class="btn sm" data-clear>Tout effacer</button><span class="small muted" data-help>Glissez sur la photo pour tracer en rouge.</span></div>`}
      <div class="anno-stage"><div class="anno-wrap"><img src="${esc(phSrc(ph))}" alt=""><svg viewBox="0 0 ${ph.w} ${ph.h}" preserveAspectRatio="none"></svg></div></div>
      <label class="f">Légende<input type="text" data-cap value="${esc(ph.cap || "")}" ${ro ? "disabled" : ""} placeholder="Ex. Éclat sur le montant de la menuiserie M23"></label>
    </div>
    <div class="modal-f">${ro ? "" : `<button class="btn danger" data-del>Supprimer la photo</button><span style="flex:1"></span>`}<button class="btn" data-x>${ro ? "Fermer" : "Annuler"}</button>${ro ? "" : `<button class="btn primary" data-save>Enregistrer</button>`}</div>
  </div></div>`;
  const svg = L.querySelector(".anno-wrap svg"); const sw = Math.max(ph.w, ph.h) / 160;
  const txt = L.querySelector("[data-txt]"), help = L.querySelector("[data-help]");
  const draw = () => { svg.innerHTML = st.shapes.concat(st.draft ? [st.draft] : []).map(s => shapeMarkup(s, sw)).join(""); };
  draw();
  const pt = ev => { const r = svg.getBoundingClientRect(); return { x: Math.round(Math.max(0, Math.min(ph.w, (ev.clientX - r.left) / r.width * ph.w))), y: Math.round(Math.max(0, Math.min(ph.h, (ev.clientY - r.top) / r.height * ph.h))) }; };
  if (!ro) {

async function ragicDetails(recordId, code) {

const g = (o, ...ks) => { for (const k of ks) { const v = o[k]; if (v != null && String(v).trim() !== "") return String(v).trim(); } return ""; };
function buildFromRagic(rec, ae, recordId) {
  const code = g(rec, "Code travaux", "CODE TRAVAUX");
  const syndic = g(rec, "syndic2", "syndic"); const gest = g(rec, "gestionnaire2", "gestionnaire");
  const intervenants = [
    { id: uid(), lot: "1", nom: prof({ agence: S.newAg }).nom, role: "Maître d'œuvre", contact: "", tel: "", email: "", logo: "", convoque: true },
    { id: uid(), lot: "2", nom: syndic || g(rec, "maitre d'ouvrage") || "Maître d'ouvrage", role: syndic ? "Syndic — représentant du maître d'ouvrage" : "Maître d'ouvrage", contact: gest, tel: g(rec, "portable gestionnaire", "Téléphone"), email: g(rec, "E-mail gestionnaire"), logo: "", convoque: true }
  ];
  const planning = [];
  const aeSorted = [...ae].sort((a, b) => g(a, "Numéro AE :").localeCompare(g(b, "Numéro AE :")));
  const seen = new Set();
  aeSorted.forEach(a => {
    const nom = g(a, "Entreprise"); if (!nom) return;
    let it = intervenants.find(i => i.nom.toLowerCase() === nom.toLowerCase());
    if (!it && !seen.has(nom.toLowerCase())) {
      seen.add(nom.toLowerCase());
      it = { id: uid(), lot: String(intervenants.length + 1), nom, role: g(a, "Lot"), contact: g(a, "Gérant"), tel: "", email: g(a, "E-mail gerant", "E-mail"), logo: "", convoque: true };
      intervenants.push(it);
    }
    const debut = ragicDate(g(a, "Début des travaux")); const fin = ragicDate(g(a, "Fin des travaux"));
    if (debut) planning.push({ id: uid(), intId: it.id, libelle: g(a, "Lot") || nom, debut, fin: fin || debut });
  });
  [["Entreprise retenue", "Téléphone2", "E-mail gérant"], ["Entreprise retenue2", "Téléphone3", "E-mail"], ["Entreprise retenue3", "Téléphone4", "E-mail2"], ["Entreprise retenue4", "Téléphone5", "E-mail3"]].forEach(([k, t, m]) => {
    const nom = g(rec, k); if (nom && !intervenants.some(i => i.nom.toLowerCase() === nom.toLowerCase())) intervenants.push({ id: uid(), lot: String(intervenants.length + 1), nom, role: "", contact: "", tel: g(rec, t), email: g(rec, m), logo: "", convoque: true });
  });
  return {
    dossier: { code, immeuble: g(rec, "Immeuble"), indice: g(rec, "Indice"), objet: g(rec, "Objet"), adresse: g(rec, "adresse"), moa: g(rec, "maitre d'ouvrage", "Maitre d'ouvrage privé"), syndic, gestionnaire: gest, ragicId: String(recordId || "") },
    intervenants, planning
  };
}

async function ragicComplete(planningOnly) {
  const d = D(); if (!CAP.mcp) return;
  toast("Lecture de Ragic…", 1500);
  try {
    const recs = d.ragicId ? [{ record_id: d.ragicId }] : await ragicSearch(d.code);
    const r0 = recs.find(r => !r["CODE TRAVAUX"] || r["CODE TRAVAUX"] === d.code) || recs[0];
    if (!r0) { toast("Opération introuvable dans Ragic"); return; }
    const det = await ragicDetails(r0.record_id, d.code);
    const b = buildFromRagic(det.rec, det.ae, r0.record_id);
    const cur = [...(d.intervenants || [])];
    const map = {};
    b.intervenants.forEach(i => { const ex = cur.find(c => c.nom.toLowerCase() === i.nom.toLowerCase()); if (ex) map[i.id] = ex.id; else if (!planningOnly && i.lot !== "1" && i.lot !== "2") { const lot = String(Math.max(0, ...cur.map(c => parseInt(c.lot, 10) || 0)) + 1); const ni = { ...i, lot }; cur.push(ni); map[i.id] = ni.id; } });
    const plan = [...(d.planning || [])]; let added = 0;
    b.planning.forEach(p => { const iid = map[p.intId] || ""; if (!plan.some(x => x.intId === iid && x.debut === p.debut && x.libelle === p.libelle)) { plan.push({ ...p, intId: iid }); added++; } });
    const addedInt = cur.length - (d.intervenants || []).length;
    await saveDossier(planningOnly ? { planning: plan } : { intervenants: cur, planning: plan });
    toast(planningOnly ? `${added} tâche(s) ajoutée(s) au planning` : `${addedInt} intervenant(s) et ${added} tâche(s) ajouté(s)`);
  } catch (e) { toast(ragicErr(e), 5000); }
}

async function clearDossierContent(id) {
  for (const col of ["photos", "docs", "points", "pvs"]) for (const r of await Store.getCol(`dossiers/${id}/${col}`)) {
    if ((col === "photos" || col === "docs") && r.assetId && CAP.assets) { try { await CAP.assets.delete(r.assetId); } catch {} }
    await Store.del(`dossiers/${id}/${col}/${r.id}`);
  }
}
async function writeDossierFromFile(id, j, extra) {
  const { id: _o, fichier: _f, ...dos } = j.dossier;
  await Store.set("dossiers/" + id, { ...dos, ...extra, updatedAt: Date.now() });
  for (const pv of j.pvs || []) { const { id: pid, ...r } = pv; await Store.set(`dossiers/${id}/pvs/${pid}`, r); }
  for (const pt of j.points || []) { const { id: pid, ...r } = pt; await Store.set(`dossiers/${id}/points/${pid}`, r); }
  let lost = 0;
  for (const col of ["photos", "docs"]) for (const x of j[col] || []) {
    const { id: xid, dataUrl, ...r } = x; const st = await dataUrlToStore(dataUrl, LIM);
    if (!st) { lost++; continue; } await Store.set(`dossiers/${id}/${col}/${xid}`, { ...r, ...st });
  }
  return lost;
}
async function importAgoarv(file, path) {
  let j; try { j = JSON.parse(await file.text()); } catch { toast("Fichier illisible : ce n'est pas un dossier .pv valide.", 4000); return; }
  if (!j || !APP.formatsLus.includes(j.format) || !j.dossier) { toast("Ce fichier n'est pas un dossier AGOA (.pv).", 4000); return; }
  if ((j.schema || 1) > APP.schema) { toast(`Fichier créé par une version plus récente (${j.version || "?"}). Mettez l'application à jour.`, 5000); return; }
  const src = j.dossier; const stamp = j.enregistreLe || j.exporteLe || "";
  const same = S.dossiers.find(d => d.id === src.id);
  if (same) {
    // Même opération : on l'ouvre. Si le fichier a été modifié ailleurs (autre poste), on reprend son contenu.
    const known = NATIVE ? syncGet(same.id) : "";
    const changed = NATIVE && stamp && stamp !== known && (!known || stamp > known);
    try {
      if (changed) {
        if (S.cur === same.id) { S.unsub.forEach(u => { try { u(); } catch {} }); S.unsub = []; S.cur = null; }
        await clearDossierContent(same.id);
        await writeDossierFromFile(same.id, j, { fichier: path || same.fichier || "", statut: same.statut || "actif" });
        syncSet(same.id, stamp);
      } else if (path && normPath(same.fichier) !== normPath(path)) await Store.update("dossiers/" + same.id, { fichier: path });
      openDossier(same.id);
      toast(changed ? `${same.code} mis à jour depuis le fichier` : `${same.code} ouvert`);
    } catch (e) { toast("Ouverture incomplète : " + (e.code || e.message || "erreur"), 4500); }
    return;
  }
  let id = src.id && !S.dossiers.some(d => d.id === src.id) ? src.id : safeId(src.code || "dossier");
  const homonyme = S.dossiers.find(d => d.code === src.code);
  if (homonyme) {
    if (!await askConfirm(`Une autre opération ${src.code} existe déjà`, "Ce fichier provient d'une autre opération portant le même code. Il sera importé à côté, avec le suffixe (copie).", "Importer en copie")) return;
    const ids = new Set(S.dossiers.map(d => d.id)); let k = 1; const b = safeId(src.code) + "-copie"; id = b; while (ids.has(id)) id = b + "-" + (++k);
  }
  toast("Ouverture en cours…", 3000);
  try {
    const lost = await writeDossierFromFile(id, j, { code: homonyme ? src.code + " (copie)" : src.code, fichier: (!homonyme && path) ? path : "", statut: "actif" });
    if (NATIVE && stamp) syncSet(id, stamp);
    openDossier(id); toast(lost ? `Opération ouverte — ${lost} fichier(s) trop lourd(s) pour le mode local, non repris.` : `${src.code} ouvert`, 4000);
  } catch (e) { toast("Ouverture incomplète : " + (e.code || e.message || "erreur"), 4500); }
}

async function createDossier(b) {

  const doc = { ...b.dossier, agence: ag, statut: "actif", intervenants: b.intervenants, planning: b.planning, planningInPv: true, reunionTexte: "", diffusion: DIFFUSION, lastPv: null, createdAt: Date.now(), updatedAt: Date.now() };

}
