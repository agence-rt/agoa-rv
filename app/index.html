          <label><input type="checkbox" class="chk" data-r="realises" ${R.realises ? "checked" : ""}> Points réalisés et traités (repliés)</label>
          <label><input type="checkbox" class="chk" data-r="photos" ${R.photos ? "checked" : ""}> Photos</label>
          <label><input type="checkbox" class="chk" data-r="plans" ${R.plans ? "checked" : ""}> Plans localisés</label>
          <label><input type="checkbox" class="chk" data-r="planning" ${R.planning ? "checked" : ""}> Planning</label></fieldset>
        <label class="f">Photos par ligne<select data-r="perRow"><option value="2" ${R.perRow == 2 ? "selected" : ""}>2 (grandes)</option><option value="3" ${R.perRow == 3 ? "selected" : ""}>3</option><option value="4" ${R.perRow == 4 ? "selected" : ""}>4 (vignettes)</option></select></label>
        <div data-mailbox></div>
        <p class="small muted">Si l'impression ne s'ouvre pas, téléchargez le fichier puis imprimez-le en PDF depuis votre navigateur.</p>
      </aside>
      <div class="doc-stage" data-stage>${docHTML(pv, R)}</div>
    </div></div></div>`;
  const stage = L.querySelector("[data-stage]");
  L.querySelectorAll("[data-r]").forEach(el => el.onchange = () => { const k = el.dataset.r; R[k] = el.type === "checkbox" ? el.checked : (k === "perRow" ? Number(el.value) : el.value); stage.innerHTML = docHTML(pv, R); L.querySelector("[data-mailbox]").innerHTML = ""; });
  L.querySelector("[data-x]").onclick = () => L.innerHTML = "";
  L.querySelector("[data-pdf]")?.addEventListener("click", async () => { const d = D(); const only = R.only && (d.intervenants || []).find(i => i.id === R.only); try { const ok = await window.agoa.savePDF(`${safeId(d.code)}-PV_N_${String(pv.num).padStart(2, "0")}${only ? "_lot" + safeId(only.lot) : ""}.pdf`); if (ok) toast("PDF enregistré"); } catch (e) { toast("PDF impossible : " + (e.message || "erreur")); } });
  L.querySelector("[data-print]").onclick = () => { try { window.print(); } catch { toast("Impression bloquée : téléchargez le fichier HTML."); } };
  L.querySelector("[data-dl]").onclick = () => exportHtml(pv, R);
  L.querySelector("[data-mail]").onclick = () => {
    const m = mailInfo(pv, R); const box = L.querySelector("[data-mailbox]");
    const href = `mailto:${m.rcpt.map(encodeURIComponent).join(",")}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
    box.innerHTML = `<div class="mailbox"><b>Envoi</b><div class="small">${m.rcpt.length ? `${m.rcpt.length} destinataire(s) : ${m.rcpt.map(esc).join(", ")}` : "Aucune adresse e-mail renseignée pour ces intervenants (onglet Intervenants)."}</div>
      <ol class="small" style="margin:0;padding-left:18px"><li>Téléchargez le compte rendu et enregistrez-le en PDF.</li><li>Ouvrez le message prérempli et joignez le PDF.</li></ol>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm primary" href="${href}" target="_blank" rel="noopener">Ouvrir le message</a><button class="btn sm" data-copy>Copier les adresses</button></div></div>`;
    box.querySelector("[data-copy]").onclick = async () => { try { await navigator.clipboard.writeText(m.rcpt.join("; ")); toast("Adresses copiées"); } catch { toast("Copie impossible dans cet affichage"); } };
  };
  L.querySelector(".ov-bg").addEventListener("keydown", ev => { if (ev.key === "Escape") L.innerHTML = ""; });
}

async function toDataUrl(src) { if (!src || src.startsWith("data:")) return src; const r = await fetch(src); const b = await r.blob(); return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); }
async function exportHtml(pv, R = REP_DEFAULT) {
  toast("Préparation du fichier…", 1500);
  const holder = document.createElement("div"); holder.innerHTML = docHTML(pv, R);
  for (const img of holder.querySelectorAll("img")) { try { img.setAttribute("src", await toDataUrl(img.getAttribute("src"))); } catch {} }
  const css = document.querySelector("style").textContent;
  const d = D(); const only = R.only && (d.intervenants || []).find(i => i.id === R.only);
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(d.code)} — CR n°${pv.num}</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet"><style>${css} :root{color-scheme:light} body{background:#5b6166}</style></head><body><div class="doc-stage">${holder.innerHTML}</div><script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>`;
  const filename = `${safeId(d.code)}_CR${String(pv.num).padStart(2, "0")}_${pv.date || ""}${only ? "_lot" + safeId(only.lot) : ""}.html`;
  if (CAP.downloads) { try { await CAP.downloads.save({ filename, data: new Blob([html], { type: "text/html" }) }); toast("Fichier enregistré — ouvrez-le pour l'imprimer en PDF"); } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Téléchargement impossible : " + (e.code || "erreur")); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

</script>
</body>
