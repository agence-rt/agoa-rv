<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>AGOA PV CHANTIER</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#fff;color:#1F2328;border:1px solid #dcdcdc;box-sizing:border-box;position:relative}
  .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:10px}
  .logo{width:126px;height:126px;border-radius:24px;background:#B3261E;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:33px;letter-spacing:.01em}
  .t{margin-top:22px;font-size:25px;font-weight:700;letter-spacing:.22em}
  .t span{color:#B3261E}
  .s{margin-top:10px;font-size:13px;color:#666}
  .v{position:absolute;right:12px;bottom:9px;font-size:11px;color:#9a9a9a}
  .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#B3261E;animation:load 1.8s ease-out forwards}
  @keyframes load{to{width:100%}}
</style></head>
<body>
  <div class="c">
    <div class="logo">AGOA</div>
    <div class="t">AGOA <span>PV CHANTIER</span></div>
    <div class="s">Suivi de chantier et procès-verbaux de réunion</div>
  </div>
  <div class="v" id="v"></div>
  <div class="bar"></div>
  <script>const q=new URLSearchParams(location.search);document.getElementById("v").textContent=q.get("v")?("v"+q.get("v")):"";</script>
</body></html>
